services:
  db:
    image: postgis/postgis:17-3.5
    container_name: bng-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 on your machine, so it doesn't clash with a local Postgres on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bng-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bng-db-data:
